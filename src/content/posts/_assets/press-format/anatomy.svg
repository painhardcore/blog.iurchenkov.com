<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" class="pf-anatomy" style="display:block;width:100%;min-width:34rem;height:auto">
  <style>
    .pf-anatomy text { font-size: 14px; fill: var(--foreground); }
    .pf-anatomy .dim { fill: var(--muted-foreground); }
    .pf-anatomy .band { fill: var(--muted); }
    .pf-anatomy .files { fill: none; stroke: var(--muted-foreground); stroke-dasharray: 4 4; }
    .pf-anatomy .root { fill: var(--accent); }
    .pf-anatomy .bank { fill: var(--accent); opacity: 0.45; }
    .pf-anatomy .lead { stroke: var(--muted-foreground); stroke-width: 1; }
  </style>
  <text x="102" y="30" text-anchor="middle">root A</text>
  <text x="102" y="48" text-anchor="middle" class="dim">1 MiB in</text>
  <text x="630" y="30" text-anchor="middle">root B</text>
  <text x="630" y="48" text-anchor="middle" class="dim">end - 1028 KiB</text>
  <line x1="102" y1="56" x2="102" y2="90" class="lead"/>
  <line x1="630" y1="56" x2="630" y2="90" class="lead"/>

  <rect x="20" y="90" width="140" height="60" rx="4" class="band"/>
  <rect x="560" y="90" width="140" height="60" rx="4" class="band"/>
  <rect x="166" y="94" width="388" height="52" rx="4" class="files"/>
  <text x="360" y="125" text-anchor="middle" class="dim">your files live here</text>

  <rect x="29" y="96" width="18" height="48" rx="2" class="bank"/>
  <rect x="98" y="96" width="8" height="48" rx="2" class="root"/>
  <rect x="626" y="96" width="8" height="48" rx="2" class="root"/>
  <rect x="674" y="96" width="18" height="48" rx="2" class="bank"/>

  <line x1="38" y1="150" x2="38" y2="172" class="lead"/>
  <line x1="683" y1="150" x2="683" y2="172" class="lead"/>
  <text x="22" y="188">bank A</text>
  <text x="22" y="206" class="dim">128 KiB in</text>
  <text x="698" y="188" text-anchor="end">bank B</text>
  <text x="698" y="206" text-anchor="end" class="dim">end - 384 KiB</text>

  <path d="M20 222v6h140v-6M560 222v6h140v-6" fill="none" class="lead"/>
  <text x="90" y="246" text-anchor="middle" class="dim">2 MiB band</text>
  <text x="630" y="246" text-anchor="middle" class="dim">2 MiB band</text>
</svg>
