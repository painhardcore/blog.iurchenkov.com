<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 395" class="staircase" style="display:block;width:100%;min-width:34rem;height:auto">
<style>
  .staircase text { font-size: 14px; fill: var(--foreground); }
  .staircase .dim { fill: var(--muted-foreground); }
  .staircase .small { font-size: 12px; }
  .staircase .big { font-size: 16px; font-weight: 700; }
  .staircase .acc { fill: var(--accent); }
  .staircase .accs { stroke: var(--accent); }
  .staircase .base { fill: var(--muted-foreground); }
  .staircase .bases { stroke: var(--muted-foreground); }
  .staircase .grid { stroke: var(--muted); stroke-width: 1; }
  .staircase .ring { stroke: var(--background); stroke-width: 2; }
  .staircase .b { font-weight: 700; }
</style>
<line x1="250.0" y1="30" x2="250.0" y2="345" class="grid"/>
<text x="250.0" y="365.0" class="dim small" text-anchor="middle">1 ms</text>
<line x1="368.1" y1="30" x2="368.1" y2="345" class="grid"/>
<text x="368.1" y="365.0" class="dim small" text-anchor="middle">10 ms</text>
<line x1="486.3" y1="30" x2="486.3" y2="345" class="grid"/>
<text x="486.3" y="365.0" class="dim small" text-anchor="middle">100 ms</text>
<line x1="604.4" y1="30" x2="604.4" y2="345" class="grid"/>
<text x="604.4" y="365.0" class="dim small" text-anchor="middle">1000 ms</text>
<text x="640.0" y="385.0" class="dim small" text-anchor="end">log scale, lower is better</text>
<text x="238.0" y="61.0" text-anchor="end">original</text>
<rect x="250" y="46" width="356.4" height="22" rx="3" class="base"/>
<text x="614.4" y="61.0" class="b">1039 ms</text>
<text x="238.0" y="101.0" text-anchor="end">borrow, no allocs</text>
<rect x="250" y="86" width="300.7" height="22" rx="3" class="acc"/>
<text x="558.7" y="101.0" class="b">351 ms</text>
<text x="238.0" y="141.0" text-anchor="end">byte scanner</text>
<rect x="250" y="126" width="260.4" height="22" rx="3" class="acc"/>
<text x="518.4" y="141.0" class="b">160 ms</text>
<text x="238.0" y="181.0" text-anchor="end">one pass</text>
<rect x="250" y="166" width="251.3" height="22" rx="3" class="acc"/>
<text x="509.3" y="181.0" class="b">134 ms</text>
<text x="238.0" y="221.0" text-anchor="end">table, no hashing</text>
<rect x="250" y="206" width="238.8" height="22" rx="3" class="acc"/>
<text x="496.8" y="221.0" class="b">105 ms</text>
<text x="238.0" y="261.0" text-anchor="end">64-byte bit masks</text>
<rect x="250" y="246" width="185.3" height="22" rx="3" class="acc"/>
<text x="443.3" y="261.0" class="b">37 ms</text>
<text x="238.0" y="301.0" text-anchor="end">NEON, unsafe</text>
<rect x="250" y="286" width="159.5" height="22" rx="3" class="acc"/>
<text x="417.5" y="301.0" class="b">22.4 ms</text>
<text x="238.0" y="341.0" class="dim" text-anchor="end">4 threads, unshipped</text>
<rect x="250" y="326" width="92.8" height="22" rx="3" fill="none" class="accs" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="350.8" y="341.0" class="dim">6.1 ms</text>
<line x1="337.5" y1="24" x2="337.5" y2="345" class="bases" stroke-width="1.5" stroke-dasharray="4 3"/>
