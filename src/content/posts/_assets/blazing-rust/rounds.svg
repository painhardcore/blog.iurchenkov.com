<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" class="rounds" style="display:block;width:100%;min-width:34rem;height:auto">
<style>
  .rounds text { font-size: 14px; fill: var(--foreground); }
  .rounds .dim { fill: var(--muted-foreground); }
  .rounds .small { font-size: 12px; }
  .rounds .big { font-size: 16px; font-weight: 700; }
  .rounds .acc { fill: var(--accent); }
  .rounds .accs { stroke: var(--accent); }
  .rounds .base { fill: var(--muted-foreground); }
  .rounds .bases { stroke: var(--muted-foreground); }
  .rounds .grid { stroke: var(--muted); stroke-width: 1; }
  .rounds .ring { stroke: var(--background); stroke-width: 2; }
  .rounds .b { font-weight: 700; }
</style>
<circle cx="110" cy="23" r="6" class="base"/>
