<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" class="price" style="display:block;width:100%;min-width:34rem;height:auto">
<style>
  .price text { font-size: 14px; fill: var(--foreground); }
  .price .dim { fill: var(--muted-foreground); }
  .price .small { font-size: 12px; }
  .price .big { font-size: 16px; font-weight: 700; }
  .price .acc { fill: var(--accent); }
  .price .accs { stroke: var(--accent); }
  .price .base { fill: var(--muted-foreground); }
  .price .bases { stroke: var(--muted-foreground); }
  .price .grid { stroke: var(--muted); stroke-width: 1; }
  .price .ring { stroke: var(--background); stroke-width: 2; }
  .price .b { font-weight: 700; }
</style>
