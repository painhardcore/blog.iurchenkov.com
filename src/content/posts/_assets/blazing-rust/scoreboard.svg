<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" class="scoreboard" style="display:block;width:100%;min-width:34rem;height:auto">
<style>
  .scoreboard text { font-size: 14px; fill: var(--foreground); }
  .scoreboard .dim { fill: var(--muted-foreground); }
  .scoreboard .small { font-size: 12px; }
  .scoreboard .big { font-size: 16px; font-weight: 700; }
  .scoreboard .acc { fill: var(--accent); }
  .scoreboard .accs { stroke: var(--accent); }
  .scoreboard .base { fill: var(--muted-foreground); }
  .scoreboard .bases { stroke: var(--muted-foreground); }
  .scoreboard .grid { stroke: var(--muted); stroke-width: 1; }
  .scoreboard .ring { stroke: var(--background); stroke-width: 2; }
  .scoreboard .b { font-weight: 700; }
</style>
<circle cx="230" cy="23" r="6" class="base"/>
<text x="242.0" y="28.0" class="dim">without the skill</text>
<circle cx="420" cy="23" r="6" class="acc"/>
<text x="432.0" y="28.0" class="dim">with the skill</text>
<line x1="230.0" y1="50" x2="230.0" y2="250" class="grid"/>
<text x="230.0" y="270.0" class="dim small" text-anchor="middle">70%</text>
<line x1="380.0" y1="50" x2="380.0" y2="250" class="grid"/>
<text x="380.0" y="270.0" class="dim small" text-anchor="middle">80%</text>
<line x1="530.0" y1="50" x2="530.0" y2="250" class="grid"/>
<text x="530.0" y="270.0" class="dim small" text-anchor="middle">90%</text>
<line x1="680.0" y1="50" x2="680.0" y2="250" class="grid"/>
<text x="680.0" y="270.0" class="dim small" text-anchor="middle">100%</text>
<text x="20.0" y="95.0">Opus 5.5</text>
<line x1="410.0" y1="90" x2="680.0" y2="90" class="bases" stroke-width="2" opacity="0.5"/>
<circle cx="410.0" cy="90" r="7" class="base ring"/>
<circle cx="680.0" cy="90" r="8" class="acc ring"/>
<text x="396.0" y="95.0" class="dim" text-anchor="end">82%</text>
<text x="680.0" y="76.0" class="b" text-anchor="middle">100%</text>
<text x="545.0" y="112.0" class="dim small" text-anchor="middle">+18 points</text>
<text x="20.0" y="157.0">Sonnet 5.5, high effort</text>
<line x1="320.0" y1="152" x2="620.0" y2="152" class="bases" stroke-width="2" opacity="0.5"/>
<circle cx="320.0" cy="152" r="7" class="base ring"/>
<circle cx="620.0" cy="152" r="8" class="acc ring"/>
<text x="306.0" y="157.0" class="dim" text-anchor="end">76%</text>
<text x="620.0" y="138.0" class="b" text-anchor="middle">96%</text>
<text x="470.0" y="174.0" class="dim small" text-anchor="middle">+20 points</text>
<text x="20.0" y="219.0">Haiku 5.5</text>
<line x1="365.0" y1="214" x2="635.0" y2="214" class="bases" stroke-width="2" opacity="0.5"/>
<circle cx="365.0" cy="214" r="7" class="base ring"/>
<circle cx="635.0" cy="214" r="8" class="acc ring"/>
<text x="351.0" y="219.0" class="dim" text-anchor="end">79%</text>
<text x="635.0" y="200.0" class="b" text-anchor="middle">97%</text>
<text x="500.0" y="236.0" class="dim small" text-anchor="middle">+18 points</text>
</svg>
