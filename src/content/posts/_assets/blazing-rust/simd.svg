<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" class="simd" style="display:block;width:100%;min-width:34rem;height:auto">
<style>
  .simd text { font-size: 14px; fill: var(--foreground); }
  .simd .dim { fill: var(--muted-foreground); }
  .simd .small { font-size: 12px; }
  .simd .big { font-size: 16px; font-weight: 700; }
  .simd .acc { fill: var(--accent); }
  .simd .accs { stroke: var(--accent); }
  .simd .base { fill: var(--muted-foreground); }
  .simd .bases { stroke: var(--muted-foreground); }
  .simd .grid { stroke: var(--muted); stroke-width: 1; }
  .simd .ring { stroke: var(--background); stroke-width: 2; }
  .simd .b { font-weight: 700; }
</style>
<line x1="170.0" y1="30" x2="170.0" y2="300" class="grid"/>
<text x="170.0" y="320.0" class="dim small" text-anchor="middle">0</text>
<line x1="265.45454545454544" y1="30" x2="265.45454545454544" y2="300" class="grid"/>
<text x="265.5" y="320.0" class="dim small" text-anchor="middle">25</text>
<line x1="360.9090909090909" y1="30" x2="360.9090909090909" y2="300" class="grid"/>
<text x="360.9" y="320.0" class="dim small" text-anchor="middle">50</text>
<line x1="456.3636363636364" y1="30" x2="456.3636363636364" y2="300" class="grid"/>
<text x="456.4" y="320.0" class="dim small" text-anchor="middle">75</text>
<line x1="551.8181818181818" y1="30" x2="551.8181818181818" y2="300" class="grid"/>
<text x="551.8" y="320.0" class="dim small" text-anchor="middle">100</text>
<text x="590.0" y="340.0" class="dim small" text-anchor="end">GB/s, higher is better</text>
<text x="158.0" y="65.0" text-anchor="end">Original loop</text>
<rect x="170" y="50" width="22.9" height="22" rx="3" class="base" opacity="0.45"/>
<text x="200.9" y="65.0"><tspan class="b">~6</tspan>  <tspan class="dim small"></tspan></text>
<text x="158.0" y="107.0" text-anchor="end">Round 1, with</text>
<rect x="170" y="92" width="118.4" height="22" rx="3" class="acc"/>
<rect x="288.4" y="92" width="11.5" height="22" rx="3" class="acc" opacity="0.45"/>
<text x="307.8" y="107.0"><tspan class="b">31–34</tspan>  <tspan class="dim small">stopped at the first win</tspan></text>
<text x="158.0" y="149.0" text-anchor="end">Round 1, without</text>
<rect x="170" y="134" width="183.3" height="22" rx="3" class="base"/>
<rect x="353.3" y="134" width="164.2" height="22" rx="3" class="base" opacity="0.45"/>
<text x="525.5" y="149.0"><tspan class="b">48–91</tspan>  <tspan class="dim small"></tspan></text>
<text x="158.0" y="191.0" text-anchor="end">Round 2, with</text>
<rect x="170" y="176" width="248.2" height="22" rx="3" class="acc"/>
<text x="426.2" y="191.0"><tspan class="b">~65</tspan>  <tspan class="dim small">16 lines, safe</tspan></text>
<text x="158.0" y="233.0" text-anchor="end">Round 4, with</text>
<rect x="170" y="218" width="351.3" height="22" rx="3" class="acc"/>
<text x="529.3" y="233.0"><tspan class="b">~92</tspan>  <tspan class="dim small">0 unsafe</tspan></text>
<text x="158.0" y="275.0" text-anchor="end">Round 4, without</text>
<rect x="170" y="260" width="358.9" height="22" rx="3" class="base"/>
<text x="536.9" y="275.0"><tspan class="b">~94</tspan>  <tspan class="dim small">10 unsafe</tspan></text>
<line x1="551.8181818181818" y1="24" x2="551.8181818181818" y2="300" class="bases" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="545.8" y="32.0" class="dim small" text-anchor="end">read-only loop, ~100</text>
</svg>
