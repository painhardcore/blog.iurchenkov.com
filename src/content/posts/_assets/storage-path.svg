<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative storage path</title>
  <desc id="desc">Requests pass from application to filesystem to block device. This is a conceptual diagram, not a benchmark.</desc>
  <rect width="800" height="180" fill="#fdfdfd"/>
  <g fill="none" stroke="#006cac" stroke-width="2">
    <rect x="20" y="50" width="200" height="80" rx="4"/>
    <rect x="300" y="50" width="200" height="80" rx="4"/>
    <rect x="580" y="50" width="200" height="80" rx="4"/>
    <path d="M220 90h80m-10-7 10 7-10 7M500 90h80m-10-7 10 7-10 7"/>
  </g>
  <g fill="#282728" font-family="sans-serif" font-size="22" text-anchor="middle">
    <text x="120" y="98">Application</text>
    <text x="400" y="98">Filesystem</text>
    <text x="680" y="98">Block device</text>
  </g>
</svg>
